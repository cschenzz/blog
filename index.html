<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>ChenZz's技术参考文档</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="网址导航, 技术文档, 在线博客, docsify">
  <meta name="keywords" content="chenzz,java,blog,tools,site,docsify" />
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  
  <link rel="icon" href="/blog/images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.staticfile.net/docsify/4.13.1/themes/vue.min.css">
  <!-- 日夜模式 -->
  <link rel="stylesheet" href="https://cdn.staticfile.net/docsify-darklight-theme/3.2.0/docsify-style.min.css"/>

  <style>
    /*--markdown代码显示的字体--*/
    .markdown-section pre>code {
      font-family: "宋体", "DejaVu Sans Mono", sans-serif;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'chenzz-blog',
      logo: '/images/avatar.jpg',
      repo: 'https://github.com/cschenzz',
      loadSidebar: true,
      loadSidebar: 'summary.md',
      alias: {
        '/.*/summary.md': '/summary.md'
      },
      homepage: '/site-nav.md',
      basePath: '/blog',
      subMaxLevel: 2,
      //自动显示标题
      autoHeader: true,
      //自动跳转到页面顶部
      auto2top: true,
      //小屏设备下合并导航栏到侧边栏
      mergeNavbar: true,
      //搜索插件
      search: {
        placeholder: '搜索',
        noData: '没有结果!',
      },
      plugins: [
        // footer
        function(hook) {
          var ad = `
          <div style="padding: 1em;">🍑^_~🍜</div>
          `;

          var footer = `
          <hr/>
          <footer>
            <span>&copy; 2024 ChenZz gitee project. All Rights Reserved.</span>
            <span><a href="https://docsify.js.org" target="_blank">Powered by docsify</a></span>
          </footer>
          `;

          hook.afterEach(function(html) {
            return ad + html + footer;
          });
        }
      ]
    }
  </script>

  <!-- Docsify v4 -->
  <script src="https://cdn.staticfile.net/docsify/4.13.1/docsify.min.js"></script>
  <script src="https://cdn.staticfile.net/docsify/4.13.1/plugins/search.min.js"></script>
  <script src="https://cdn.staticfile.net/docsify/4.13.1/plugins/emoji.min.js"></script>
  <script src="https://cdn.staticfile.net/docsify/4.13.1/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.staticfile.net/docsify-copy-code/3.0.0/docsify-copy-code.min.js"></script>

  <!-- 代码高亮 -->
  <script src="https://cdn.staticfile.net/prism/1.9.0/components/prism-bash.min.js"></script>
  <script src="https://cdn.staticfile.net/prism/1.9.0/components/prism-java.min.js"></script>
  <script src="https://cdn.staticfile.net/prism/1.9.0/components/prism-json.min.js"></script>
  <script src="https://cdn.staticfile.net/prism/1.9.0/components/prism-sql.min.js"></script>
  <!-- 日夜模式 -->
  <script src="https://cdn.staticfile.net/docsify-darklight-theme/3.2.0/index.min.js"></script>
</body>
</html>
